[workspace]
members = ["."]

[package]
exclude = ["BACKLOG.md", "target/"]
name = "kernelkit"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
repository = "https://github.com/santhreal/kernelkit"
homepage = "https://santh.dev"
documentation = "https://docs.rs/kernelkit"
description = "Cross-platform kernel optimization toolkit with Linux fast paths and safe fallbacks"
readme = "README.md"
keywords = ["linux", "kernel", "numa", "hugepages", "mlock"]
categories = ["memory-management", "hardware-support", "os::linux-apis"]
include = ["src/**", "Cargo.toml"]

[package.metadata.santh]
status = "stable"

[dependencies]
libc = "0.2"
libloading = { version = "0.8", default-features = false }
memmap2 = "0.9"
thiserror = "2"

[dev-dependencies]
criterion = "0.5"
faultkit = { version = "0.2.0" }
libc = "0.2"
proptest = "1"
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_docs = "warn"

[[test]]
name = "shard_s_perf_pmg_edge"
path = "tests/shard_s_perf_pmg_edge.rs"

[[bench]]
name = "mmap_bench"
harness = false

[[bench]]
name = "binformat_bench"
harness = false
